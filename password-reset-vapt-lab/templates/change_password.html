{% extends "base.html" %}
{% block content %}
<section class="auth-card">
  <span class="eyebrow">Authenticated flow</span>
  <h1>Change password</h1>
  <p class="muted">This flow requires the current password and revokes all server-side sessions after success.</p>
  <form method="post" class="form-grid">
    <input type="hidden" name="mode" value="{{ mode }}">
    <label for="current_password">Current password</label>
    <input id="current_password" name="current_password" type="password" required>
    <label for="new_password">New password</label>
    <input id="new_password" name="new_password" type="password" required>
    <button class="button primary" type="submit">Change password</button>
  </form>
</section>
{% endblock %}
