{% extends "base.html" %}
{% block content %}
<section class="auth-card">
  <span class="eyebrow">Synthetic authentication</span>
  <h1>Sign in</h1>
  <p class="muted">Use a documented local test account. No real credentials are accepted or needed.</p>
  <form method="post" class="form-grid">
    <input type="hidden" name="mode" value="{{ mode }}">
    <label for="identifier">Email, username, or user ID</label>
    <input id="identifier" name="identifier" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="button primary" type="submit">Sign in</button>
  </form>
  <div class="form-links">
    <a href="{{ mode_url('forgot_password', mode) }}">Forgot password?</a>
    <a href="{{ mode_url('register', mode) }}">Register synthetic account</a>
  </div>
</section>
{% endblock %}
